name: ci

on:
  push:
    branches:
      - 'dev'
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  security-events: write  # Required to upload Trivy SARIF to GitHub Security tab

jobs:

  docker:
    runs-on: ubuntu-latest

    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            psaintelligence/exiftool-web
            ghcr.io/psaintelligence/exiftool-web
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Validate build configuration
        uses: docker/build-push-action@v6
        with:
          call: check

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: exiftool-web:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy action is pinned by commit SHA for security.
      # Find the latest release tag and its pinned SHA at:
      # https://github.com/aquasecurity/trivy-action/releases

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: exiftool-web:scan
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: exiftool-web:scan
          format: cyclonedx
          output: sbom.json
          scanners: vuln

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
