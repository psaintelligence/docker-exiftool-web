name: ci

on:
  push:
    branches:
      - 'dev'
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  security-events: write  # Required to upload Trivy SARIF to GitHub Security tab

jobs:

  docker:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            psaintelligence/exiftool-web
            ghcr.io/psaintelligence/exiftool-web
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Validate build configuration
        uses: docker/build-push-action@v6
        with:
          call: check

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get scan target
        id: scan-target
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "image=$(echo "$TAGS" | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Trivy action is pinned by commit SHA for security.
      # Find the latest release tag and its pinned SHA at:
      # https://github.com/aquasecurity/trivy-action/releases

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.scan-target.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 30

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.scan-target.outputs.image }}
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

      # Push the already-built local image to all registries.
      - name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo ":: Pushing $tag"
              docker push "$tag"
            fi
          done <<< "$TAGS"

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: psaintelligence/exiftool-web
          readme-filepath: ./README.md
          enable-url-completion: true
